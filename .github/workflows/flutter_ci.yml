name: Flutter CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  flutter-analyze:
    name: Analyze Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: lumina
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: lumina
        run: flutter analyze || true

  python-lint:
    name: Lint Python Pipeline Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install flake8 pyyaml google-generativeai firebase-admin PyPDF2 python-dotenv

      - name: Lint scripts/ (Syntax & Critical Errors)
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 scripts/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 scripts/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
