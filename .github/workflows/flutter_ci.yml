name: Flutter CI

# Runs automatically on every Pull Request and push to main.
# Blocks merging if flutter analyze finds errors.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  flutter-analyze:
    name: Analyze & Test Flutter App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: lumina
        run: flutter pub get

      - name: Run Flutter Analyze
        working-directory: lumina
        run: flutter analyze --no-pub
        # This catches type errors, deprecated APIs, and bad patterns
        # A PR with analyze errors will be blocked from merging

      - name: Run Flutter Tests
        working-directory: lumina
        run: flutter test --no-pub
        # Runs all widget and unit tests in lumina/test/
        # PRs that break existing tests cannot be merged

  python-lint:
    name: Lint Python Pipeline Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install linting tools
        run: pip install flake8

      - name: Lint scripts/
        run: |
          flake8 scripts/ \
            --max-line-length=120 \
            --exclude=scripts/venv,scripts/__pycache__ \
            --count --statistics
        # Catches syntax errors and common Python mistakes in the pipeline
