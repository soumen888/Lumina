<script>
        function selectOption(element) {
            // Clear previous selections
            const allOptions = document.querySelectorAll('.glass-card');
            allOptions.forEach(opt => {
                opt.classList.remove('selected');
                const radio = opt.querySelector('.option-radio');
                const dot = opt.querySelector('.dot');
                radio.classList.replace('border-primary', 'border-outline/30');
                dot.classList.replace('scale-100', 'scale-0');
            });

            // Set new selection
            element.classList.add('selected');
            const radio = element.querySelector('.option-radio');
            const dot = element.querySelector('.dot');
            radio.classList.replace('border-outline/30', 'border-primary');
            dot.classList.replace('scale-0', 'scale-100');

            // Haptic-like feedback animation
            element.style.transform = 'scale(0.98)';
            setTimeout(() => {
                element.style.transform = '';
            }, 100);
        }

        // Simple Countdown logic visual
        let time = 765; // 12:45 in seconds
        const timerLabel = document.querySelector('.font-label-md.text-on-surface');
        
        setInterval(() => {
            time--;
            const mins = Math.floor(time / 60);
            const secs = time % 60;
            timerLabel.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    </script>
